seed: 42

data:
  image_size: 224
  batch_size: 32
  num_workers: 2
  val_fraction: 0.15
  test_fraction: 0.15

model:
  name: resnet18
  pretrained: true
  num_classes: 2
  dropout: 0.2

training:
  epochs: 10
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 3

paths:
  data_root: data/raw/chest_xray/train
  test_root: data/raw/chest_xray/test
  model_path: models/pneumovision_resnet18.pth
  metrics_path: reports/metrics/metrics.json
